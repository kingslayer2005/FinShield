# Prometheus configuration for FinShield monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the FastAPI service metrics
  - job_name: "finshield-api"
    static_configs:
      - targets: ["host.docker.internal:8001"]
    metrics_path: /metrics

  # Scrape the consumer metrics
  - job_name: "finshield-consumer"
    static_configs:
      - targets: ["host.docker.internal:8002"]
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
